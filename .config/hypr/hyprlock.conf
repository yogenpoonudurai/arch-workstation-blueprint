general {
  hide_cursor = false
}

background {
  monitor =
  path = ~/Pictures/Wallpapers/current.jpg
  color = rgba(0e0e11ff)
  blur_passes = 3
  blur_size = 7
  brightness = 0.5
  vibrancy = 0.2
}

input-field {
  monitor =
  size = 320, 52
  outline_thickness = 2
  rounding = 12
  dots_size = 0.25
  dots_spacing = 0.3
  dots_center = true
  outer_color = rgba(7aa2f7ff)
  inner_color = rgba(16161aff)
  font_color = rgba(e6e6ebff)
  fail_color = rgba(e06c75ff)
  check_color = rgba(7aa2f7ff)
  placeholder_text = Password
  fail_text = Authentication failed
}

label {
  monitor =
  text = $TIME
  font_size = 72
  font_family = JetBrainsMono Nerd Font
  color = rgba(e6e6ebff)
  position = 0, 160
  halign = center
  valign = center
}

label {
  monitor =
  text = Arch
  font_size = 16
  font_family = JetBrainsMono Nerd Font
  color = rgba(9a9aa3ff)
  position = 0, 80
  halign = center
  valign = center
}
