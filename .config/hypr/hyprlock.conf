general {
  hide_cursor = false
}

background {
  monitor =
  path = ~/Pictures/Wallpapers/current.jpg
  blur_passes = 2
  blur_size = 5
  brightness = 0.55
  vibrancy = 0.2
}

input-field {
  monitor =
  size = 300, 48
  outline_thickness = 2
  dots_size = 0.25
  dots_spacing = 0.3
  dots_center = true
  outer_color = rgba(2e2e36ff)
  inner_color = rgba(16161aff)
  font_color = rgba(e6e6ebff)
  fail_color = rgba(e06c75ff)
  check_color = rgba(7aa2f7ff)
  placeholder_text = Password
  fail_text = Authentication failed
}

label {
  monitor =
  text = $TIME
  font_size = 48
  font_family = JetBrainsMono Nerd Font
  color = rgba(e6e6ebff)
  position = 0, 120
  halign = center
  valign = center
}
