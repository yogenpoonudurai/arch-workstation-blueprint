general {
  hide_cursor = false
}

background {
  monitor =
  path = ~/Pictures/Wallpapers/current.jpg
  color = rgba(0e0e11ff)
  blur_passes = 2
  blur_size = 5
  brightness = 0.55
  vibrancy = 0.15
}

input-field {
  monitor =
  size = 300, 48
  outline_thickness = 1
  rounding = 12
  dots_size = 0.25
  dots_spacing = 0.3
  dots_center = true
  outer_color = rgba(7aa2f7cc)
  inner_color = rgba(16161ae6)
  font_color = rgba(e6e6ebff)
  fail_color = rgba(e06c75ff)
  check_color = rgba(7aa2f7ff)
  placeholder_text = Password
  fail_text = Authentication failed
  position = 0, -20
  halign = center
  valign = center
}

label {
  monitor =
  text = $TIME
  font_size = 64
  font_family = Inter
  color = rgba(e6e6ebff)
  position = 0, 120
  halign = center
  valign = center
}

label {
  monitor =
  text = cmd[update:60000] date +"%A %d %B"
  font_size = 15
  font_family = Inter
  color = rgba(9a9aa3ff)
  position = 0, 60
  halign = center
  valign = center
}

label {
  monitor =
  text = cmd[update:30000] upower -i /org/freedesktop/UPower/devices/battery_BAT0 2>/dev/null | grep -E "percentage|state" | tr '\n' ' ' || echo ""
  font_size = 13
  font_family = Inter
  color = rgba(6b6b76ff)
  position = 0, -90
  halign = center
  valign = center
}
