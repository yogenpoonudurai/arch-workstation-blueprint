# starship — minimal, palette-synced. Rendered by theme-render, do not edit.
format = "$directory$git_branch$git_status$cmd_duration$line_break$character"

[directory]
style = "#b8c3ff"
truncation_length = 3
truncate_to_repo = true

[git_branch]
style = "#90909a"
format = "[$branch]($style) "

[git_status]
style = "#e4bad9"
format = "[$all_status]($style)"

[cmd_duration]
min_time = 2000
style = "#90909a"

[character]
success_symbol = "[❯](#b8c3ff)"
error_symbol = "[❯](#ffb4ab)"
