# tmux — fast, minimal, Alacritty + Wayland friendly
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",alacritty:Tc,xterm-256color:Tc"
set -as terminal-features ",alacritty:RGB"
set -as terminal-features ",*:usstyle"

set -g prefix C-b
set -g prefix2 C-a
bind C-b send-prefix
bind C-a send-prefix -2

set -s escape-time 0
set -g focus-events on
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
setw -g mode-keys vi
set -g renumber-windows on
set -g history-limit 100000
set -g status-interval 5

# OLED-friendly minimal status matching Waybar
set -g status-style "bg=#16161a,fg=#e6e6eb"
set -g status-left "#[fg=#7aa2f7,bold] #S "
set -g status-left-length 20
set -g status-right "#[fg=#9a9aa3]%a %d %b %H:%M "
set -g status-right-length 40
setw -g window-status-current-style "bg=#7aa2f7,fg=#0e0e11,bold"
setw -g window-status-current-format " #I:#W "
setw -g window-status-format " #I:#W "

# Splits + reload in cwd
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind r source-file ~/.config/tmux/tmux.conf \; display "reloaded"
# Prefix + / enters copy mode and opens its vi-style scrollback search.
bind / copy-mode \; send-keys /

# Wayland clipboard via wl-copy (no plugin manager = fast startup)
# - set-clipboard: tmux yanks go to system clipboard (OSC-52 to Alacritty)
# - allow-passthrough: apps inside tmux (nvim, lazygit) can use OSC-52 too
set -g set-clipboard on
set -g allow-passthrough on
bind -T copy-mode-vi y send-keys -X copy-pipe "wl-copy"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe "wl-copy"
bind p run "wl-paste --no-newline | tmux load-buffer - ; tmux paste-buffer"
